<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- (First: its base, before the links relative to it.) -->
    <%= htmlWebpackPlugin.tags.headTags %>
    <title><%= htmlWebpackPlugin.options.title %></title>

    <!-- Its icon (src/demo/assets/icon.svg, its variants made by
         scripts/icons.js), and as a Home Screen app. -->
    <link rel="manifest" href="assets/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icon-rounded.svg" />
    <link rel="icon" type="image/png" sizes="196x196" href="assets/favicon-196.png" />
    <link rel="apple-touch-icon" href="assets/apple-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="uikit-ish" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<% for (const splash of htmlWebpackPlugin.options.splashes) { %>
    <link rel="apple-touch-startup-image" href="assets/<%= splash.file %>" media="<%= splash.media %>" />
<% } %>
  </head>
  <body></body>
</html>
